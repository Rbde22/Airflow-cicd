name: Flight Booking CICD

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: project-01e6277e-ecd7-4798-ad3
  REGION: us-central1

jobs:
  upload-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/890977586545/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: 890977586545-compute@developer.gserviceaccount.com

      # Install and setup gcloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Explicitly set project (CRITICAL FIX)
      - name: Set GCP Project
        run: gcloud config set project $PROJECT_ID

      # Upload variables.json to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gsutil cp variables/dev/variables.json \
          gs://us-central1-airflow-dev-7ac3bc73-bucket/data/dev/variables.json

      # Import Variables into Airflow DEV
      - name: Import Variables into Airflow-DEV
        run: |
          gcloud composer environments run airflow-dev \
            --location $REGION \
            variables import -- /home/airflow/gcs/data/dev/variables.json

      # Upload Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py \
          gs://airflow-projects-bucket9feb2026/flight-booking-analysis/spark-job/

      # Upload DAG to Composer DEV
      - name: Upload Airflow DAG to DEV Environment
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-dev \
            --location $REGION \
            --source airflow_job/airflow_job.py


  upload-to-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/890977586545/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: 890977586545-compute@developer.gserviceaccount.com

      # Install and setup gcloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # Explicitly set project (CRITICAL FIX)
      - name: Set GCP Project
        run: gcloud config set project $PROJECT_ID

      # Upload variables.json to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gsutil cp variables/prod/variables.json \
          gs://us-central1-airflow-prod-e65a1775-bucket/data/prod/variables.json

      # Import Variables into Airflow PROD
      - name: Import Variables into Airflow-PROD
        run: |
          gcloud composer environments run airflow-prod \
            --location $REGION \
            variables import -- /home/airflow/gcs/data/prod/variables.json

      # Upload Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gsutil cp spark_job/spark_transformation_job.py \
          gs://airflow-projects-bucket9feb2026/flight-booking-analysis/spark-job/

      # Upload DAG to Composer PROD
      - name: Upload Airflow DAG to PROD Environment
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-prod \
            --location $REGION \
            --source airflow_job/airflow_job.py